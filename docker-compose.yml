services:
  api:
    build: ./backend
    environment:
      APP_MODE: local
      DATABASE_PATH: /data/telemetry.db
      CORS_ORIGINS: http://localhost:5173
    volumes: [telemetry-data:/data]
    ports: ["8000:8000"]
  dashboard:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports: ["5173:5173"]
    depends_on: [api]
volumes:
  telemetry-data:
